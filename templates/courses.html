<!DOCTYPE html>
<html>

<head>
    <title>Course Enrollment</title>
</head>

<body>

    <h2>Course Enrollment</h2>

    <form method="POST">

        Student Name:
        <input type="text" name="student_name" required>
        <br><br>

        Course Name:
        <input type="text" name="course_name" required>
        <br><br>

        Credits:
        <input type="number" name="credits" required>
        <br><br>

        <button type="submit">
            Add Course
        </button>

    </form>

</body>

</html>
