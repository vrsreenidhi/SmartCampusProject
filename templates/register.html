<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h2>Student Registration Form</h2>

    <form method="POST">

        Name:
        <input type="text" name="name" required>
        <br><br>

        Age:
        <input type="number" name="age" required>
        <br><br>

        Score:
        <input type="number" name="score" required>
        <br><br>

        <button type="submit">
            Register Student
        </button>

    </form>

</body>

</html>
